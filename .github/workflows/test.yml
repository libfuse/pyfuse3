name: Test

on:
  push:
  pull_request:
    branches: [main]

# For a PR branch, the push and the pull_request event trigger the same tests,
# so keep only the most recent run for a branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FORCE_COLOR: 1

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        os: [ubuntu-24.04]
        include:
          # 3.15 is not released yet, uv will install the latest pre-release.
          - python-version: "3.15"
            os: ubuntu-26.04

    steps:
      - uses: actions/checkout@v4
        with:
          # Retrieve some git history, which will hopefully include the last release tag
          # and enable us to generate better version numbers.
          fetch-depth: 256

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libattr1-dev libfuse3-dev fuse3 pkg-config gcc

      - name: Build
        run: uv sync --locked

      - name: Lint (ruff)
        run: uv run ruff check

      - name: Lint (format)
        run: uv run ruff format --diff

      - name: Type check (mypy)
        run: uv run mypy .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Run tests
        run: uv run pytest -v -rs test/

      - name: Build docs
        run: uv run sphinx-build -W --keep-going -b html rst doc/html
